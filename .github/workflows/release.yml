name: release

# A tag like v0.2.0 builds the Windows download, checks it and publishes it as a GitHub release
# with that version's part of CHANGELOG.md. Started by hand, it only builds and keeps the zip as
# an artifact of the run.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-build.lock
      - name: Install the tested versions
        run: |
          python -m pip install --require-hashes -r requirements-build.lock
          python -m pip install --no-deps .
      - name: Check that the tag is the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import etl_tool, os
          tag = os.environ["GITHUB_REF_NAME"]
          assert tag == f"v{etl_tool.__version__}", f"tag {tag}, but the version is {etl_tool.__version__}"
      - name: Build and check
        run: python tools/build.py
      - uses: actions/upload-artifact@v7
        with:
          name: download
          path: dist/Tafl-*-windows.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: download
          path: dist
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## / { take = index($0, "## " v " ") == 1 || $0 == "## " v } take' CHANGELOG.md | tail -n +2 > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --title "Tafl ${GITHUB_REF_NAME#v}" --notes-file notes.md
