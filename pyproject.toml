[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tafl"
dynamic = ["version"]
description = "Desktop data preparation tool: build tables step by step and see the data after every step"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "xv8mna" }]
# Not 3.15 yet: DuckDB and pyodbc have no wheels for it, and building them from source fails.
requires-python = ">=3.12,<3.15"
keywords = ["etl", "data-preparation", "polars", "duckdb", "pyside6", "excel", "csv", "sql-server"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Office/Business",
]
# The tested versions are in requirements.lock (tools/lock.py writes it). The ranges stop before
# the next major version, which may change what Tafl relies on.
dependencies = [
    "polars>=2.0,<3",
    "duckdb>=1.5,<2",
    "pyarrow>=20",  # only the Arrow format that Polars and DuckDB exchange data in
    "fastexcel>=0.21,<1",
    "xlsxwriter>=3.2,<4",
    "lxml>=5,<7",
    "pyodbc>=5.3,<6",
    "PySide6-Essentials>=6.12,<7",
    "send2trash>=2.0,<3",
    "tzdata; sys_platform == 'win32'",  # time zones: Python on Windows reads them from it
]

# setuptools is the build backend: with it in requirements-dev.lock and requirements-build.lock,
# Tafl installs from those alone (pip install --no-deps --no-build-isolation, as CI does).
# requirements.lock has only what Tafl needs to run: an install with it lets pip get setuptools.
[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-qt>=4.4,<5", "openpyxl>=3.1,<4", "ruff==0.17.0", "setuptools>=77"]
build = ["pyinstaller>=6.22,<7", "setuptools>=77"]  # the Windows download (tools/build.py)

[project.urls]
Homepage = "https://github.com/xv8mna/tafl"
Issues = "https://github.com/xv8mna/tafl/issues"

[project.scripts]
tafl = "tafl.cli:main"

[project.gui-scripts]
tafl-app = "tafl.ui.app:main"

[tool.setuptools.dynamic]
version = { attr = "tafl.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["E501", "B905"]
